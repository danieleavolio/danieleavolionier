<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#c8c2aa" />
		<script>
			(() => {
				try {
					const stored = localStorage.getItem('theme');
					if (stored === 'dark' || stored === 'light') {
						document.documentElement.dataset.theme = stored;
						document
							.querySelector('meta[name="theme-color"]')
							?.setAttribute('content', stored === 'dark' ? '#2e2c26' : '#c8c2aa');
					}
				} catch {
					/* localStorage can be unavailable; keep the default light theme. */
				}

				try {
					const stored = localStorage.getItem('locale');
					const language = stored || navigator.language || 'it';
					const locale = language.toLowerCase().startsWith('en') ? 'en' : 'it';
					document.documentElement.lang = locale;
					document.documentElement.dataset.locale = locale;
				} catch {
					/* Keep the server-detected language. */
				}
			})();
		</script>
		<meta name="google-site-verification" content="FTolVaK-x02wu54OEQqZv2yP7npBnNRQtI6mSv8W4RQ" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="icon" href="/favicon.png" />
		<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
		<meta name="author" content="Daniele Avolio" />
		<link
			rel="alternate"
			type="application/rss+xml"
			title="Daniele Avolio - RSS Feed"
			href="https://www.danieleavolio.it/rss.xml"
		/>
		<link rel="manifest" href="/site.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
